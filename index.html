<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Lumenfolio Desktop Prototype</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "SF Pro Display", "SF Pro Text", "Segoe UI", "PingFang SC", sans-serif;
        --boot-bg: #17181b;
        --boot-panel: #202329;
        --boot-line: #32363d;
        --boot-text: #f3f4f6;
        --boot-muted: #9aa3af;
        --boot-accent: #6aa9ff;
      }

      html,
      body,
      #app {
        margin: 0;
        min-height: 100%;
        background: var(--boot-bg);
      }

      .boot-shell {
        height: 100vh;
        display: grid;
        place-items: center;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.035), rgba(255, 255, 255, 0)),
          var(--boot-bg);
        color: var(--boot-text);
      }

      .boot-card {
        width: min(360px, calc(100vw - 48px));
        display: grid;
        gap: 16px;
        justify-items: center;
      }

      .boot-mark {
        width: 70px;
        height: 70px;
        border-radius: 18px;
        display: grid;
        place-items: center;
        border: 1px solid rgba(106, 169, 255, 0.42);
        background: rgba(255, 255, 255, 0.045);
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.32);
      }

      .boot-logo {
        width: 54px;
        height: 54px;
        display: block;
        object-fit: contain;
      }

      .boot-title {
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0;
      }

      .boot-subtitle {
        color: var(--boot-muted);
        font-size: 13px;
      }

      .boot-bar {
        width: 220px;
        height: 3px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.1);
      }

      .boot-bar::before {
        content: "";
        display: block;
        width: 44%;
        height: 100%;
        border-radius: inherit;
        background: var(--boot-accent);
        animation: boot-progress 1.1s ease-in-out infinite;
      }

      @keyframes boot-progress {
        0% { transform: translateX(-105%); }
        100% { transform: translateX(245%); }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot-shell" role="status" aria-live="polite">
        <div class="boot-card">
          <div class="boot-mark" aria-hidden="true">
            <img class="boot-logo" src="./src/assets/lumenfolio-logo-transparent.png" alt="" />
          </div>
          <div class="boot-title">Lumenfolio</div>
          <div class="boot-subtitle">Preparing your reading workspace</div>
          <div class="boot-bar" aria-hidden="true"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
  </html>
