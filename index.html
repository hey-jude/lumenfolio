<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Lumenfolio</title>
    <script>
      /* Runs before the boot styles below, and long before Vue: the splash
         screen paints while the bundle is still downloading, so resolving the
         theme in JS after mount would show a dark flash on every launch for
         anyone using the light one. Classic script, not type="module" — modules
         are deferred and would land after that first paint.

         The key is duplicated from src/theme.js; that module cannot be imported
         here. Fails closed to dark, which is the default anyway. */
      (function () {
        try {
          var stored = window.localStorage.getItem('lumenfolio.theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : stored === 'system' &&
                  window.matchMedia &&
                  !window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'light'
                : 'dark'
          document.documentElement.dataset.theme = theme
        } catch (err) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
    <style>
      /* Deliberately duplicated from tokens.css rather than imported: the splash
         must paint from this file alone, before any stylesheet is fetched.
         Keep the two in step by eye — there are only six values. */
      :root {
        color-scheme: dark;
        font-family: "SF Pro Display", "SF Pro Text", "Segoe UI", "PingFang SC", sans-serif;
        --boot-bg: #17181b;
        --boot-panel: #202329;
        --boot-line: #32363d;
        --boot-text: #f3f4f6;
        --boot-muted: #9aa3af;
        --boot-accent: #6aa9ff;
        --boot-sheen: rgba(255, 255, 255, 0.035);
        --boot-track: rgba(255, 255, 255, 0.1);
        --boot-mark-bg: rgba(255, 255, 255, 0.045);
        --boot-mark-shadow: rgba(0, 0, 0, 0.32);
      }

      :root[data-theme="light"] {
        color-scheme: light;
        --boot-bg: #f1f2f3;
        --boot-panel: #ffffff;
        --boot-line: #e6e8ea;
        --boot-text: #1f2124;
        --boot-muted: #5c6068;
        --boot-accent: #0b7ff5;
        --boot-sheen: rgba(16, 24, 40, 0.02);
        --boot-track: rgba(16, 24, 40, 0.1);
        --boot-mark-bg: #ffffff;
        --boot-mark-shadow: rgba(16, 24, 40, 0.1);
      }

      html,
      body,
      #app {
        margin: 0;
        min-height: 100%;
        background: var(--boot-bg);
      }

      .boot-shell {
        height: 100vh;
        display: grid;
        place-items: center;
        background:
          linear-gradient(180deg, var(--boot-sheen), transparent),
          var(--boot-bg);
        color: var(--boot-text);
      }

      .boot-card {
        width: min(360px, calc(100vw - 48px));
        display: grid;
        gap: 16px;
        justify-items: center;
      }

      .boot-mark {
        width: 70px;
        height: 70px;
        border-radius: 18px;
        display: grid;
        place-items: center;
        border: 1px solid var(--boot-line);
        background: var(--boot-mark-bg);
        box-shadow: 0 18px 40px var(--boot-mark-shadow);
      }

      .boot-logo {
        width: 54px;
        height: 54px;
        display: block;
        object-fit: contain;
      }

      .boot-title {
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0;
      }

      .boot-subtitle {
        color: var(--boot-muted);
        font-size: 13px;
      }

      .boot-bar {
        width: 220px;
        height: 3px;
        overflow: hidden;
        border-radius: 999px;
        background: var(--boot-track);
      }

      .boot-bar::before {
        content: "";
        display: block;
        width: 44%;
        height: 100%;
        border-radius: inherit;
        background: var(--boot-accent);
        animation: boot-progress 1.1s ease-in-out infinite;
      }

      @keyframes boot-progress {
        0% { transform: translateX(-105%); }
        100% { transform: translateX(245%); }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot-shell" role="status" aria-live="polite">
        <div class="boot-card">
          <div class="boot-mark" aria-hidden="true">
            <img class="boot-logo" src="./src/assets/lumenfolio-logo-transparent.png" alt="" />
          </div>
          <div class="boot-title">Lumenfolio</div>
          <div class="boot-subtitle">Preparing your reading workspace</div>
          <div class="boot-bar" aria-hidden="true"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
  </html>
