<text x="44" y="120"><tspan fill="#2f6fed">## </tspan>核心问题</text>
<text x="44" y="146">页+bbox 只对 PDF 有意义。</text>
<text x="44" y="172">非分页源(网页/笔记)应当用</text>
<text x="44" y="198"><tspan fill="#cf7a00">`chunk-id + 偏移`</tspan> 作锚点。</text>
