<svg viewBox="0 0 540 470" role="img" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, system-ui, sans-serif">
<title>侧栏：图标栏 + 面板 + 捕获</title><desc>Obsidian 式：48px 图标栏切换面板；来源面板是文件夹树（任意类型混放）；右上加号弹出捕获菜单。新捕获默认落根级，可后归档，无独立收件箱。</desc>
