name: Release builds

on:
  workflow_dispatch:
    inputs:
      build_macos_arm64:
        description: Build macOS Apple Silicon package
        required: true
        type: boolean
        default: true
      build_macos_x64:
        description: Build macOS Intel package
        required: true
        type: boolean
        default: true
      build_windows_x64:
        description: Build Windows x64 package
        required: true
        type: boolean
        default: true
      run_pdf2zh_smoke:
        description: Run PDFMathTranslate sidecar smoke test
        required: true
        type: boolean
        default: false
      publish_release:
        description: Attach build outputs to a GitHub Release
        required: true
        type: boolean
        default: false
      release_tag:
        description: Optional release tag, for example v0.1.1. Defaults to v + package.json version.
        required: false
        type: string
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"

jobs:
  macos-arm64:
    name: macOS Apple Silicon
    if: ${{ github.event_name == 'push' || inputs.build_macos_arm64 }}
    runs-on: macos-15
    env:
      LUMENFOLIO_PDF2ZH_SMOKE_DIR: ${{ runner.temp }}/lumenfolio-pdf2zh-worker-smoke
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Rust
        run: |
          rustup update stable
          rustup default stable

      - name: Install dependencies
        run: npm ci

      - name: Read version
        run: echo "APP_VERSION=$(node -p \"require('./package.json').version\")" >> "$GITHUB_ENV"

      - name: Run frontend checks
        run: |
          npm run check:translation-linking
          npm run test:unit
          npm run build
          npm run check:prod-no-testids

      - name: Build PDFMathTranslate sidecar runtime
        run: npm run build:pdf2zh-runtime:macos -- --force --python=python3

      - name: Verify release runtime
        env:
          LUMENFOLIO_PDF2ZH_REQUIRE_RELEASE_RUNTIME: "1"
        run: npm run check:pdf2zh-release

      - name: Smoke test PDFMathTranslate sidecar
        if: ${{ github.event_name == 'push' || inputs.run_pdf2zh_smoke }}
        env:
          LUMENFOLIO_PDF2ZH_PYTHON: ${{ github.workspace }}/resources/pdf2zh-sidecar/python/bin/python3
        run: npm run smoke:pdf2zh

      - name: Build Tauri bundle
        run: npm run tauri:build

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp src-tauri/target/release/bundle/dmg/*.dmg artifacts/
          ditto -c -k --keepParent src-tauri/target/release/bundle/macos/Lumenfolio.app "artifacts/Lumenfolio_${APP_VERSION}_aarch64.app.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lumenfolio-macos-aarch64-${{ env.APP_VERSION }}
          path: artifacts/*
          if-no-files-found: error

  macos-x64:
    name: macOS Intel
    if: ${{ github.event_name == 'push' || inputs.build_macos_x64 }}
    runs-on: macos-15-intel
    env:
      LUMENFOLIO_PDF2ZH_SMOKE_DIR: ${{ runner.temp }}/lumenfolio-pdf2zh-worker-smoke
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Rust
        run: |
          rustup update stable
          rustup default stable

      - name: Install dependencies
        run: npm ci

      - name: Read version
        run: echo "APP_VERSION=$(node -p \"require('./package.json').version\")" >> "$GITHUB_ENV"

      - name: Run frontend checks
        run: |
          npm run check:translation-linking
          npm run test:unit
          npm run build
          npm run check:prod-no-testids

      - name: Build PDFMathTranslate sidecar runtime
        run: npm run build:pdf2zh-runtime:macos -- --force --python=python3

      - name: Verify release runtime
        env:
          LUMENFOLIO_PDF2ZH_REQUIRE_RELEASE_RUNTIME: "1"
        run: npm run check:pdf2zh-release

      - name: Smoke test PDFMathTranslate sidecar
        if: ${{ github.event_name == 'push' || inputs.run_pdf2zh_smoke }}
        env:
          LUMENFOLIO_PDF2ZH_PYTHON: ${{ github.workspace }}/resources/pdf2zh-sidecar/python/bin/python3
        run: npm run smoke:pdf2zh

      - name: Build Tauri bundle
        run: npm run tauri:build

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp src-tauri/target/release/bundle/dmg/*.dmg artifacts/
          ditto -c -k --keepParent src-tauri/target/release/bundle/macos/Lumenfolio.app "artifacts/Lumenfolio_${APP_VERSION}_x64.app.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lumenfolio-macos-x64-${{ env.APP_VERSION }}
          path: artifacts/*
          if-no-files-found: error

  windows-x64:
    name: Windows x64
    if: ${{ github.event_name == 'push' || inputs.build_windows_x64 }}
    runs-on: windows-latest
    env:
      LUMENFOLIO_PDF2ZH_SMOKE_DIR: ${{ runner.temp }}\lumenfolio-pdf2zh-worker-smoke
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Rust
        shell: pwsh
        run: |
          rustup update stable
          rustup default stable

      - name: Install dependencies
        run: npm ci

      - name: Read version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run frontend checks
        run: |
          npm run check:translation-linking
          npm run test:unit
          npm run build
          npm run check:prod-no-testids

      - name: Prepare PDFMathTranslate Python environment
        run: npm run setup:pdf2zh

      - name: Build PDFMathTranslate sidecar executable
        run: npm run build:pdf2zh-runtime:windows -- --clean

      - name: Verify release runtime
        shell: pwsh
        env:
          LUMENFOLIO_PDF2ZH_REQUIRE_RELEASE_RUNTIME: "1"
          LUMENFOLIO_PDF2ZH_REQUIRE_WINDOWS: "1"
        run: |
          npm run check:pdf2zh-release
          npm run check:pdf2zh-windows-readiness

      - name: Smoke test PDFMathTranslate sidecar
        if: ${{ github.event_name == 'push' || inputs.run_pdf2zh_smoke }}
        shell: pwsh
        env:
          LUMENFOLIO_PDF2ZH_SIDECAR: ${{ github.workspace }}\resources\pdf2zh-sidecar\pdf2zh-sidecar.exe
        run: npm run smoke:pdf2zh

      - name: Build Tauri bundle
        run: npm run tauri:build

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Get-ChildItem src-tauri\target\release\bundle -Recurse -Include *.exe,*.msi | ForEach-Object {
            Copy-Item $_.FullName -Destination artifacts
          }
          if (-not (Get-ChildItem artifacts)) {
            throw "No Windows installer artifacts were found"
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lumenfolio-windows-x64-${{ env.APP_VERSION }}
          path: artifacts/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs:
      - macos-arm64
      - macos-x64
      - windows-x64
    if: ${{ always() && (github.event_name == 'push' || inputs.publish_release) && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Resolve release tag
        run: |
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            echo "RELEASE_TAG=${{ github.event.inputs.release_tag }}" >> "$GITHUB_ENV"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            VERSION="$(node -p "require('./package.json').version")"
            echo "RELEASE_TAG=v${VERSION}" >> "$GITHUB_ENV"
          fi

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: List release assets
        run: find release-assets -maxdepth 3 -type f -print

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: release-assets/**/*
          fail_on_unmatched_files: true
          generate_release_notes: true
