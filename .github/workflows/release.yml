name: Release desktop builds

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to build, for example v0.0.1"
        required: true
        type: string

permissions:
  contents: write

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.12"
  RUST_VERSION: "1.89.0"

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-24.04
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Create or reuse GitHub release
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            const tagName = context.eventName === 'workflow_dispatch'
              ? core.getInput('tag_name')
              : context.ref.replace('refs/tags/', '')

            if (!tagName || tagName === context.ref) {
              core.setFailed('Release workflow must run from a tag or receive tag_name.')
              return
            }

            const releaseBody = [
              'Automated Lumenfolio desktop release.',
              '',
              'Artifacts:',
              '- macOS Intel: x86_64 .app.zip, ad-hoc signed unless Developer ID signing is added later.',
              '- macOS Apple Silicon: arm64 .app.zip, ad-hoc signed unless Developer ID signing is added later.',
              '- Windows: x86_64 MSI.',
              '',
              'This release bundles the PDFMathTranslate/pdf2zh sidecar runtime. See THIRD_PARTY_NOTICES.md for AGPL and source availability notes.',
            ].join('\n')

            let release
            try {
              const response = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tagName,
              })
              release = response.data
              core.info(`Reusing existing release ${release.id} for ${tagName}.`)
            } catch (error) {
              if (error.status !== 404) throw error
              const response = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tagName,
                name: `Lumenfolio ${tagName}`,
                body: releaseBody,
                draft: true,
                prerelease: false,
                generate_release_notes: false,
              })
              release = response.data
              core.info(`Created draft release ${release.id} for ${tagName}.`)
            }

            core.setOutput('release_id', String(release.id))
            core.setOutput('tag_name', tagName)

  build-tauri:
    name: Build ${{ matrix.label }}
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app
            sidecar_runtime: macos
            python_arch: x64
            asset_suffix: macos-x86_64
            tauri_feature_args: ""
          - label: macOS Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
            bundles: app
            sidecar_runtime: macos
            python_arch: arm64
            asset_suffix: macos-arm64
            tauri_feature_args: "--features ocr-onnx"
          - label: Windows x86_64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: msi
            sidecar_runtime: windows
            python_arch: x64
            asset_suffix: windows-x86_64
            tauri_feature_args: "--features ocr-onnx"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: ${{ matrix.python_arch }}

      - name: Set up Rust
        run: |
          rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal
          rustup default ${{ env.RUST_VERSION }}
          rustup target add ${{ matrix.target }}

      - name: Cache Rust build output
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Fetch bundled OCR models
        run: npm run fetch:models

      - name: Build bundled PDF2ZH runtime for macOS
        if: matrix.sidecar_runtime == 'macos'
        run: npm run build:pdf2zh-runtime:macos -- --force

      - name: Ad-hoc sign bundled PDF2ZH runtime for macOS
        if: matrix.sidecar_runtime == 'macos'
        run: npm run sign:pdf2zh-runtime:macos

      - name: Build bundled PDF2ZH runtime for Windows
        if: matrix.sidecar_runtime == 'windows'
        run: |
          npm run setup:pdf2zh
          npm run build:pdf2zh-runtime:windows -- --clean --skip-readiness

      - name: Verify bundled PDF2ZH runtime for Windows
        if: matrix.sidecar_runtime == 'windows'
        env:
          LUMENFOLIO_PDF2ZH_REQUIRE_WINDOWS: "1"
          LUMENFOLIO_PDF2ZH_WINDOWS_PROBE_TIMEOUT_MS: "300000"
        run: npm run check:pdf2zh-windows-readiness

      - name: Verify bundled PDF2ZH release runtime
        env:
          LUMENFOLIO_PDF2ZH_REQUIRE_RELEASE_RUNTIME: "1"
        run: npm run check:pdf2zh-release

      - name: Build and upload macOS app bundle
        if: matrix.sidecar_runtime == 'macos'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          TAG_NAME: ${{ needs.create-release.outputs.tag_name }}
          APPLE_SIGNING_IDENTITY: "-"
        run: |
          upload_release_asset() {
            local path="$1"
            local content_type="$2"
            local asset_name
            local encoded_name
            local existing_id

            asset_name="$(basename "$path")"
            existing_id="$(
              curl -fsSL \
                -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?per_page=100" |
              ruby -rjson -e 'asset = JSON.parse(STDIN.read).find { |item| item["name"] == ARGV[0] }; print asset["id"] if asset' "$asset_name"
            )"

            if [ -n "$existing_id" ]; then
              curl -fsSL \
                -X DELETE \
                -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${existing_id}" >/dev/null
            fi

            encoded_name="$(ruby -rcgi -e 'print CGI.escape(ARGV[0])' "$asset_name")"
            curl --fail-with-body -sSL \
              -X POST \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: ${content_type}" \
              --data-binary @"$path" \
              "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=${encoded_name}" >/dev/null
            echo "Uploaded ${asset_name}"
          }

          npm run tauri -- build --target ${{ matrix.target }} ${{ matrix.tauri_feature_args }} --bundles app
          ditto -c -k --keepParent \
            "src-tauri/target/${{ matrix.target }}/release/bundle/macos/Lumenfolio.app" \
            "Lumenfolio_${TAG_NAME}_${{ matrix.asset_suffix }}.app.zip"
          upload_release_asset "Lumenfolio_${TAG_NAME}_${{ matrix.asset_suffix }}.app.zip" "application/zip"

      - name: Build and upload Windows MSI bundle
        if: matrix.sidecar_runtime == 'windows'
        uses: tauri-apps/tauri-action@action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --target ${{ matrix.target }} ${{ matrix.tauri_feature_args }} --bundles ${{ matrix.bundles }}

  upload-notices:
    name: Upload legal notices
    needs: create-release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Package PDFMathTranslate source notice
        run: |
          cp external/PDFMathTranslate/pdf2zh/kernel/PDFMathTranslate-next.git/LICENSE PDFMathTranslate-AGPL-3.0-LICENSE.txt
          git -C external/PDFMathTranslate/pdf2zh/kernel/PDFMathTranslate-next.git archive \
            --format=tar.gz \
            --output="$GITHUB_WORKSPACE/PDFMathTranslate-next-source.tar.gz" \
            HEAD

      - name: Upload release notices and sidecar source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          upload_release_asset() {
            local path="$1"
            local content_type="$2"
            local asset_name
            local encoded_name
            local existing_id

            asset_name="$(basename "$path")"
            existing_id="$(
              curl -fsSL \
                -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?per_page=100" |
              ruby -rjson -e 'asset = JSON.parse(STDIN.read).find { |item| item["name"] == ARGV[0] }; print asset["id"] if asset' "$asset_name"
            )"

            if [ -n "$existing_id" ]; then
              curl -fsSL \
                -X DELETE \
                -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${existing_id}" >/dev/null
            fi

            encoded_name="$(ruby -rcgi -e 'print CGI.escape(ARGV[0])' "$asset_name")"
            curl --fail-with-body -sSL \
              -X POST \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: ${content_type}" \
              --data-binary @"$path" \
              "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=${encoded_name}" >/dev/null
            echo "Uploaded ${asset_name}"
          }

          upload_release_asset THIRD_PARTY_NOTICES.md text/markdown
          upload_release_asset NOTICE text/plain
          upload_release_asset LICENSE text/plain
          upload_release_asset PDFMathTranslate-AGPL-3.0-LICENSE.txt text/plain
          upload_release_asset PDFMathTranslate-next-source.tar.gz application/gzip

  publish-release:
    name: Publish release
    needs:
      - create-release
      - build-tauri
      - upload-notices
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Publish draft release
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: Number('${{ needs.create-release.outputs.release_id }}'),
              draft: false,
              prerelease: false,
            })
