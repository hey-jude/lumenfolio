name: Release desktop builds

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to build, for example v0.0.1"
        required: true
        type: string

permissions:
  contents: write

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.12"
  RUST_VERSION: "1.89.0"

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-24.04
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Create or reuse GitHub release
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            const tagName = context.eventName === 'workflow_dispatch'
              ? core.getInput('tag_name')
              : context.ref.replace('refs/tags/', '')

            if (!tagName || tagName === context.ref) {
              core.setFailed('Release workflow must run from a tag or receive tag_name.')
              return
            }

            const releaseBody = [
              'Automated Lumenfolio desktop release.',
              '',
              'Artifacts:',
              '- macOS Intel: x86_64 DMG, ad-hoc signed unless Developer ID signing is added later.',
              '- macOS Apple Silicon: arm64 DMG, ad-hoc signed unless Developer ID signing is added later.',
              '- Windows: x86_64 MSI.',
              '',
              'This release bundles the PDFMathTranslate/pdf2zh sidecar runtime. See THIRD_PARTY_NOTICES.md for AGPL and source availability notes.',
            ].join('\n')

            let release
            try {
              const response = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tagName,
              })
              release = response.data
              core.info(`Reusing existing release ${release.id} for ${tagName}.`)
            } catch (error) {
              if (error.status !== 404) throw error
              const response = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tagName,
                name: `Lumenfolio ${tagName}`,
                body: releaseBody,
                draft: true,
                prerelease: false,
                generate_release_notes: false,
              })
              release = response.data
              core.info(`Created draft release ${release.id} for ${tagName}.`)
            }

            core.setOutput('release_id', String(release.id))
            core.setOutput('tag_name', tagName)

  build-tauri:
    name: Build ${{ matrix.label }}
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
            sidecar_runtime: macos
            python_arch: x64
          - label: macOS Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
            bundles: dmg
            sidecar_runtime: macos
            python_arch: arm64
          - label: Windows x86_64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: msi
            sidecar_runtime: windows
            python_arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: ${{ matrix.python_arch }}

      - name: Set up Rust
        run: |
          rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal
          rustup default ${{ env.RUST_VERSION }}
          rustup target add ${{ matrix.target }}

      - name: Cache Rust build output
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build bundled PDF2ZH runtime for macOS
        if: matrix.sidecar_runtime == 'macos'
        run: npm run build:pdf2zh-runtime:macos -- --force

      - name: Ad-hoc sign bundled PDF2ZH runtime for macOS
        if: matrix.sidecar_runtime == 'macos'
        run: npm run sign:pdf2zh-runtime:macos

      - name: Build bundled PDF2ZH runtime for Windows
        if: matrix.sidecar_runtime == 'windows'
        run: |
          npm run setup:pdf2zh
          npm run build:pdf2zh-runtime:windows -- --clean

      - name: Verify bundled PDF2ZH release runtime
        env:
          LUMENFOLIO_PDF2ZH_REQUIRE_RELEASE_RUNTIME: "1"
        run: npm run check:pdf2zh-release

      - name: Build and upload Tauri bundle
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.sidecar_runtime == 'macos' && '-' || '' }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

  upload-notices:
    name: Upload legal notices
    needs: create-release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Package PDFMathTranslate source notice
        run: |
          cp external/PDFMathTranslate/pdf2zh/kernel/PDFMathTranslate-next.git/LICENSE PDFMathTranslate-AGPL-3.0-LICENSE.txt
          git -C external/PDFMathTranslate/pdf2zh/kernel/PDFMathTranslate-next.git archive \
            --format=tar.gz \
            --output="$GITHUB_WORKSPACE/PDFMathTranslate-next-source.tar.gz" \
            HEAD

      - name: Upload release notices and sidecar source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.create-release.outputs.tag_name }}
        run: |
          gh release upload "$TAG_NAME" \
            THIRD_PARTY_NOTICES.md \
            NOTICE \
            LICENSE \
            PDFMathTranslate-AGPL-3.0-LICENSE.txt \
            PDFMathTranslate-next-source.tar.gz \
            --clobber

  publish-release:
    name: Publish release
    needs:
      - create-release
      - build-tauri
      - upload-notices
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Publish draft release
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: Number('${{ needs.create-release.outputs.release_id }}'),
              draft: false,
              prerelease: false,
            })
