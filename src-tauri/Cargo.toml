[package]
name = "lumenfolio_desktop"
version = "0.2.3"
description = "Lumenfolio shell"
authors = ["Sotarium"]
license = "AGPL-3.0"
repository = ""
edition = "2021"
rust-version = "1.89"
default-run = "lumenfolio_desktop"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "lumenfolio_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[features]
default = []
tsr-onnx = ["dep:image", "dep:ort"]
ocr-onnx = ["dep:image", "dep:ort"]

[dependencies]
base64 = "0.22"
regex = "1"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
rfd = "0.15"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "socks"] }
tauri = { version = "2.10.3", features = ["macos-private-api"] }
tauri-plugin-log = "2"
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
tokio-util = "0.7"
ort = { version = "2.0.0-rc.12", optional = true, default-features = false, features = ["api-24", "copy-dylibs", "download-binaries", "ndarray", "std", "tls-native"] }
image = { version = "0.25", optional = true, default-features = false, features = ["jpeg", "png"] }
pdfium-render = { version = "0.8.35", default-features = false, features = ["pdfium_latest", "thread_safe", "image_025"] }
rmcp = { version = "1.7.0", features = ["transport-streamable-http-server", "server-side-http"] }
hyper = { version = "1.10.1", features = ["server", "http1"] }
hyper-util = { version = "0.1.20", features = ["server", "tokio", "http1"] }
http-body-util = "0.1.3"
rand = "0.10.1"
# `dates` (→ chrono) so ExcelDateTime renders as a real date, not its raw serial.
calamine = { version = "0.35.0", features = ["dates"] }
# docx/pptx are ZIP+XML; only the deflate codec is needed (skip bzip2/zstd/lzma/aes).
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
quick-xml = "0.40.1"

[dev-dependencies]
tauri = { version = "2.10.3", features = ["macos-private-api", "test"] }
